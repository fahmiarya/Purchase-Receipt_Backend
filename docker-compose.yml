services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_HOST: "%"        
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-init:
    image: mysql:8.0
    command: >
      sh -c "
        until mysql -h db -uroot -p${MYSQL_ROOT_PASSWORD} -e 'SELECT 1' > /dev/null 2>&1; do
          echo 'Waiting for MySQL...'; sleep 2;
        done;
        mysql -h db -uroot -p${MYSQL_ROOT_PASSWORD} -e '
          CREATE DATABASE IF NOT EXISTS procurement_db_shadow;
          GRANT ALL PRIVILEGES ON *.* TO root@\"%\" WITH GRANT OPTION;
          FLUSH PRIVILEGES;
        '"
    depends_on:
      db:
        condition: service_healthy

  app:
    command: >
      sh -c "npx prisma generate &&
            npx prisma migrate deploy &&
            npx prisma db seed &&
            node src/server.js"
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}"
      SHADOW_DATABASE_URL: "mysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/${MYSQL_DATABASE}_shadow"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

volumes:
  mysql-data: